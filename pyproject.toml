[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-rl"
version = "1.0.0"
description = "Regime-aware momentum strategy selection with a Gaussian HMM and a PPO agent (UPF TFG, 2025/26)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tom Owen Prats", email = "tom.owenprats@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pyyaml>=6",
    "hmmlearn>=0.3",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "pyportfolioopt>=1.5",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
regime-rl = "regime_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["slow: trains a PPO agent; deselect with -m 'not slow'"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["regime_rl"]
omit = ["*/reporting/plots.py", "*/cli.py"]
